name: Publish images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/nginx.conf
      - pyproject.toml
      - uv.lock
      - src/**
      - ui/**
      - contexts/**
      - .github/workflows/publish-images.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dirdr/jesse-${{ matrix.target }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jesse-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=jesse-${{ matrix.target }}

  deploy:
    name: Deploy to cluster
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Get cluster repository token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.DIRDR_CI_APP_ID }}
          private-key: ${{ secrets.DIRDR_CI_APP_PEM }}
          owner: dirdr
          repositories: adrien_kubernetes_cluster
      - name: Bump image tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ secrets.DIRDR_CI_APP_ID }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/dirdr/adrien_kubernetes_cluster.git" cluster
          cd cluster
          sed -i "s|tag: sha-.*|tag: sha-${GITHUB_SHA}|" helm/jesse/values.yaml
          git config user.name "dirdr-ci[bot]"
          git config user.email "${APP_ID}+dirdr-ci[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "chore(jesse): bump to sha-${GITHUB_SHA::7}"
          git push
