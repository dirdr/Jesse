[project]
name = "jesse"
version = "0.1.0"
description = "Autonomous experimental investigations through computer use"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "hai-agents[cli,desktop]",
    "pydantic-ai-slim[openai]>=2.66,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
jesse = "jesse.selecting.cli:main"
jesse-netlogo = "jesse.experiments.netlogo.cli:main"
jesse-analyze = "jesse.analyzing.cli:main"
jesse-coolant = "jesse.experiments.coolant.cli:main"
jesse-ui = "jesse.conversation.web:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
