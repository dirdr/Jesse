[project]
name = "jesse"
version = "0.1.0"
description = "Autonomous experimental investigations through computer use"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.66,<3",
    "gladiaio-sdk>=2.2.1",
    "hai-agents[cli,desktop]",
    "sounddevice>=0.5.6",
]

[project.scripts]
jesse = "jesse.selecting.cli:main"
jesse-netlogo = "jesse.experiments.netlogo.cli:main"
jesse-analyze = "jesse.analyzing.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
