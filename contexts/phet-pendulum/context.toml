id = "phet-pendulum"
title = "Hidden gravity on Planet X"
application = "PhET Pendulum Lab"
activity = "Lab screen → Gravity: Planet X"
status = "Unverified: web interaction proof is pending."

questions = [
  "What is the gravity on Planet X? Measure it with the pendulum.",
  "Find the hidden gravitational acceleration on Planet X in PhET Pendulum Lab, and check whether the pendulum's mass changes the result.",
  "Does a large swing angle bias a pendulum measurement of g?",
]
unsupported = [
  "Measure gravity on a real planet or calibrate a physical pendulum.",
  "Change friction, add a second pendulum or estimate air resistance.",
  "Read the hidden gravity value from the simulator source code or settings.",
]
assumptions = [
  "Findings concern PhET Pendulum Lab's simulated Planet X, not a real planet.",
  "Friction is set to None; the pendulum is an ideal point mass on a massless string.",
  "Small-angle periods follow T = 2π√(L/g); swings stay under 15° except the amplitude control.",
  "Length and period are the values displayed by the simulator's length readout and Period Timer.",
]
completion = [
  "At least three small-angle fit trials at displayed lengths spanning at least 0.3 m, each with the period read from the Period Timer.",
  "Gravity estimated in Python from a least-squares fit of T² against L, with R² of at least 0.999.",
  "A mass control at a fit length shows whether mass changes the period.",
  "The outcome is decided in Python from the recorded readings; the agent's prose never changes it.",
]
sources = [
  "https://phet.colorado.edu/en/simulations/pendulum-lab",
  "https://phet.colorado.edu/files/teachers-guide/pendulum-lab-html-guide_en.pdf",
]
tools = ["publish_update", "acknowledge_researcher_message"]

