id = "netlogo-fire"
title = "Forest density and fire spread"
application = "NetLogo"
activity = "Models Library → Sample Models → Earth Science → Fire"
status = "Unverified: desktop and web interaction proofs are pending."

questions = [
  "How does tree density change how much of a forest burns?",
  "Compare the burned percentage at 55% and 70% tree density in the Fire simulation, then repeat both conditions.",
]
unsupported = [
  "Predict real wildfire damage, evacuation safety or forest management policy.",
  "Estimate a critical density or crossing probability from a large parameter sweep.",
  "Add wind, moisture, firebreaks or change the model code or world geometry.",
]
assumptions = [
  "Findings concern the bundled NetLogo Fire simulation only; no wind and spread to four adjacent neighbors.",
  "Each Setup generates a new random forest; two repeats per density describe these runs, not a population probability.",
  "Density is the requested initial occupancy percentage, not an exact observed tree count.",
  "The percent burned monitor is 100 × burned-trees / initial-trees, excluding the ignited left boundary from the initial green-tree count.",
  "Ticks are model steps, not seconds; keep the default world geometry unchanged.",
]
completion = [
  "Four fresh trials: low-1 at 55%, high-1 at 70%, low-2 at 55%, high-2 at 70%.",
  "For every trial, preserve evidence of the density, fresh Setup and final percent burned after Go stops naturally.",
  "Compare both densities and the repeats using the checked analysis; preserve incomplete trials and uncertainty.",
  "A supported scientific conclusion still requires replay review; never substitute documented expectations for observations.",
]
sources = [
  "https://ccl.northwestern.edu/netlogo/models/Fire",
  "https://www.netlogoweb.org/docs/faq",
]
tools = ["publish_update", "acknowledge_researcher_message"]

[surfaces.desktop]
app_path = "/Applications/NetLogo 7.0.4/NetLogo 7.0.4.app"

[surfaces.web]
start_url = "https://www.netlogoweb.org/launch#https://www.netlogoweb.org/assets/modelslib/Sample%20Models/Earth%20Science/Fire.nlogox"
width = 1280
height = 900

[limits]
budget_seconds = 600
max_steps = 110
max_trials = 4
